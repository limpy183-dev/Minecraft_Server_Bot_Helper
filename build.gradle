plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Runs a class's `main` self-check against the mod's real classpath.
//   ./gradlew selfCheck -Pcheck=com.damia.movrand.Journal
tasks.register('selfCheck', JavaExec) {
	group = 'verification'
	description = 'Run a self-check main() with assertions on'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = project.findProperty('check') ?: 'com.damia.movrand.AreaCoverage'
	jvmArgs '-ea'
	// Minecraft's log4j writes logs/latest.log relative to the working directory, and on a
	// case-insensitive filesystem that lands inside the mod's own Logs folder. Keep it in run/.
	workingDir = file('run')
	doFirst { workingDir.mkdirs() }
}
